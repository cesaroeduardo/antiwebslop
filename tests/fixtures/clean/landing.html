<!doctype html>
<html>
<head>
  <style>
    :root { --bg: #FBFBFA; --fg: #17181A; --muted: #5B5F66; --accent: #0F766E; --border: #E4E4E1; }
    body { font-family: 'Söhne', 'Helvetica Neue', sans-serif; background: var(--bg); color: var(--fg); }
    h1 { font-family: 'GT Sectra', Georgia, serif; font-size: clamp(2.5rem, 6vw, 4.5rem); line-height: 1.05; }
    .cta { background: var(--accent); transition: background-color .2s ease-out, transform .2s ease-out; }
    .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: no-preference) { .reveal { animation: rise .3s ease-out; } }
  </style>
</head>
<body>
  <section class="hero">
    <p class="eyebrow">Pokémon Unite · match history</p>
    <h1>Every ranked match you play, with win rates per hero and per lane.</h1>
    <p>Paste your trainer ID. We pull your last 200 games and show where you actually win.</p>
    <a class="cta" href="/import">Import my matches</a>
    <a href="/demo">See a sample profile</a>
  </section>
  <ul>
    <li>Updates after every match</li>
    <li>Exports to CSV</li>
  </ul>
  <footer>© 2026 Unite Lib</footer>
</body>
</html>
