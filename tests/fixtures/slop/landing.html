<!doctype html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #F4F1EA; }
    .hero { background: linear-gradient(135deg, #7c3aed, #4f46e5); }
    .title { -webkit-background-clip: text; color: transparent; }
    .glass { backdrop-filter: blur(12px); }
    .orb { filter: blur(120px); }
    .btn { transition: all .3s; }
    .btn:focus { outline: none; }
    .accent { color: #D97757; }
    @keyframes float { to { transform: translateY(-8px); } }
    .float { animation: float 3s infinite; }
  </style>
</head>
<body>
  <section class="hero text-center">
    <span class="badge">✨ New: AI insights</span>
    <h1 class="title">Unlock the power of your data</h1>
    <p class="text-center">Supercharge your workflow with seamless, cutting-edge tools.</p>
    <a class="btn" href="#">Get Started</a>
    <p class="text-center">Trusted by 10,000+ teams worldwide. 10x faster than before.</p>
  </section>
  <ul>
    <li>🚀 Lightning fast</li>
  </ul>
  <blockquote class="text-center">"Changed everything!" — Jane Doe, CEO at Acme</blockquote>
  <p class="text-center">Lorem ipsum dolor sit amet.</p>
  <p class="text-center">Footer</p>
  <p class="text-center">More</p>
</body>
</html>
